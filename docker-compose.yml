# Docker Compose 编排（16课：容器化部署）
# 一键启动前后端：docker compose up -d --build
# 前端运行在 80 端口，后端运行在 3000 端口，前端 Nginx 将 /api 反向代理到后端
services:
  backend:
    build: ./feynman-platform-backend
    container_name: feynman-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # 以下敏感配置建议通过 .env 文件注入（docker compose 会自动读取同级 .env）
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      # 说明：百度语音识别（07课）复用 QIANFAN_API_KEY（bce-v3 Bearer 鉴权），
      # 旧的 BAIDU_API_KEY / BAIDU_SECRET_KEY 与 QIANFAN_SECRET_KEY 代码里并未读取，已移除
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - QIANFAN_API_KEY=${QIANFAN_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # 本地 Whisper 服务（7.5课进阶，可选）：容器要访问宿主机上的 Python 服务
      - WHISPER_API_URL=${WHISPER_API_URL:-http://host.docker.internal:5001/transcribe}
    # Linux 上让 host.docker.internal 指向宿主机（Docker Desktop 已内置该名字）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  frontend:
    build: ./feynman-platform-frontend
    container_name: feynman-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
