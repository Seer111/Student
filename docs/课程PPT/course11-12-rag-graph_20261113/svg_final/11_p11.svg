<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F5F7FA"/>
  <rect x="80" y="64" width="4" height="592" fill="#16233A"/>
  <text x="1168" y="96" font-family="Consolas, monospace" font-size="15" font-weight="400" fill="#6B7A90" text-anchor="end">11 / 17</text>
  <text x="112" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7A90" text-anchor="start">PART B · 动机</text>
  <text x="112" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#16233A" text-anchor="start">三种问题，列表答不了</text>
  <line x1="112" y1="176" x2="1168" y2="176" stroke="#D9E1EC" stroke-width="1"/>
  <text x="112" y="214" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="400" fill="#16233A" text-anchor="start">只有在「图」上，结构才变成一眼能看出来的东西。</text>
  <rect x="112" y="262" width="330" height="250" rx="10" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="1"/>
  <text x="136" y="296" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7A90" text-anchor="start" letter-spacing="1">场景一</text>
  <text x="136" y="324" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#16233A" text-anchor="start">这个知识点的前置是什么</text>
  <text x="136" y="354" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">顺着箭头往上找</text>
  <text x="136" y="378" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">一条路径就是学习顺序</text>
  <rect x="475" y="262" width="330" height="250" rx="10" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="1"/>
  <text x="499" y="296" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7A90" text-anchor="start" letter-spacing="1">场景二</text>
  <text x="499" y="324" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#16233A" text-anchor="start">哪一块我还没连上</text>
  <text x="499" y="354" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">孤岛节点 = 没建立联系</text>
  <text x="499" y="378" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">密度低的区域 = 薄弱环节</text>
  <rect x="838" y="262" width="330" height="250" rx="10" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="1"/>
  <text x="862" y="296" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7A90" text-anchor="start" letter-spacing="1">场景三</text>
  <text x="862" y="324" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#16233A" text-anchor="start">我的知识有没有断层</text>
  <text x="862" y="354" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">看长链是否断开</text>
  <text x="862" y="378" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">断点就是下一步要补的</text>
  <text x="112" y="570" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7A90" text-anchor="start">一句话：列表回答「有什么」，图谱回答「怎么连」。</text>
</svg>
