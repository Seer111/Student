<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F5F7FA"/>
  <rect x="80" y="64" width="4" height="592" fill="#16233A"/>
  <text x="1168" y="96" font-family="Consolas, monospace" font-size="15" font-weight="400" fill="#6B7A90" text-anchor="end">02 / 17</text>
  <text x="112" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7A90" text-anchor="start">课程地图</text>
  <text x="112" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#16233A" text-anchor="start">两段路，四个交付物</text>
  <line x1="112" y1="176" x2="1168" y2="176" stroke="#D9E1EC" stroke-width="1"/>
  <text x="112" y="214" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="400" fill="#16233A" text-anchor="start">先让 AI 会查（Part A），再让关系看得见（Part B）。</text>
  <rect x="112" y="258" width="512" height="246" rx="10" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="1"/>
  <text x="136" y="292" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7A90" text-anchor="start" letter-spacing="1">PART A · 约 3.5 小时</text>
  <text x="136" y="320" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#16233A" text-anchor="start">检索与生成：把图书馆变成会回答的人</text>
  <text x="136" y="350" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">① 后端检索器（90 分钟）</text>
  <text x="136" y="374" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">② RAG 链与上下文协议</text>
  <text x="136" y="398" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">③ 前端 AI 对话页（105 分钟）</text>
  <text x="136" y="422" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">④ 前后端联调（15 分钟）</text>
  <text x="136" y="446" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">产出：/ai/rag-qa 接口 + 对话页 + 依据回链</text>
  <rect x="656" y="258" width="512" height="246" rx="10" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="1"/>
  <text x="680" y="292" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="400" fill="#6B7A90" text-anchor="start" letter-spacing="1">PART B · 约 3.5 小时</text>
  <text x="680" y="320" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#16233A" text-anchor="start">知识图谱：把知识点连成一张网</text>
  <text x="680" y="350" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">① 关系数据与后端接口（75 分钟）</text>
  <text x="680" y="374" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">② ECharts 力导向图（120 分钟）</text>
  <text x="680" y="398" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">③ 节点与边的视觉编码</text>
  <text x="680" y="422" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">④ 交互与美化（15 分钟）</text>
  <text x="680" y="446" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#4A5568" text-anchor="start">产出：/graph/knowledge-map 接口 + 图谱页</text>
  <text x="112" y="548" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7A90" text-anchor="start">四个交付物：检索接口 · 对话页 · 图谱接口 · 可交互的图谱页。</text>
</svg>
