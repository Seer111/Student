<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F5F7FA"/>
  <rect x="80" y="64" width="4" height="592" fill="#16233A"/>
  <text x="1168" y="96" font-family="Consolas, monospace" font-size="15" font-weight="400" fill="#6B7A90" text-anchor="end">08 / 17</text>
  <text x="112" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#6B7A90" text-anchor="start">PART A · 接口</text>
  <text x="112" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#16233A" text-anchor="start">一个接口：问题进，答案与依据一起出</text>
  <line x1="112" y1="176" x2="1168" y2="176" stroke="#D9E1EC" stroke-width="1"/>
  <text x="112" y="214" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="400" fill="#16233A" text-anchor="start">POST /api/ai/rag-qa —— 返回 answer 之外，还要返回它引用了哪些知识点。</text>
  <rect x="112" y="254" width="512" height="212" rx="10" fill="#0F1B2D"/>
  <text x="136" y="286" font-family="Consolas, monospace" font-size="12" font-weight="400" fill="#7FA7D9" text-anchor="start">请求</text>
  <text x="136" y="310" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#7FA7D9" text-anchor="start">POST /api/ai/rag-qa</text>
  <text x="136" y="334" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#D8E2F0" text-anchor="start">{</text>
  <text x="136" y="358" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#8FB8E8" text-anchor="start">  &quot;question&quot;: &quot;什么是闭包？&quot;</text>
  <text x="136" y="382" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#D8E2F0" text-anchor="start">}</text>
  <text x="136" y="406" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#7FA7D9" text-anchor="start">// 只带问题，不带知识点 id</text>
  <text x="136" y="430" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#7FA7D9" text-anchor="start">// 用户隔离由 token 决定</text>
  <rect x="656" y="254" width="512" height="236" rx="10" fill="#0F1B2D"/>
  <text x="680" y="286" font-family="Consolas, monospace" font-size="12" font-weight="400" fill="#7FA7D9" text-anchor="start">响应</text>
  <text x="680" y="310" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#D8E2F0" text-anchor="start">{</text>
  <text x="680" y="334" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#8FB8E8" text-anchor="start">  &quot;answer&quot;: &quot;闭包是函数记着自己的作用域……&quot;,</text>
  <text x="680" y="358" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#8FB8E8" text-anchor="start">  &quot;sources&quot;: [</text>
  <text x="680" y="382" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#D8E2F0" text-anchor="start">    { &quot;title&quot;: &quot;闭包与作用域链&quot;, &quot;knowledgePointId&quot;: &quot;…&quot; }</text>
  <text x="680" y="406" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#D8E2F0" text-anchor="start">  ]</text>
  <text x="680" y="430" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#D8E2F0" text-anchor="start">}</text>
  <text x="680" y="454" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#7FA7D9" text-anchor="start">// sources 让前端能点回知识点</text>
  <text x="112" y="512" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#4A5568" text-anchor="start">内部三步：取 question → queryVectorStore 取片段 → 拼 context 交给链。</text>
  <text x="112" y="548" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#4A5568" text-anchor="start">失败分流：400 缺参数 / 200 但 answer 为空（库没料）/ 500 模型异常。</text>
  <text x="112" y="604" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="400" fill="#F2994A" text-anchor="start">没有依据就不要编：sources 为空时，前端要显示「知识库里还没有相关内容」。</text>
</svg>
