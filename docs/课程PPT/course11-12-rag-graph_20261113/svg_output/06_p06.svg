  <rect x="650" y="262" width="247" height="96" rx="10" fill="#FFFFFF" stroke="#D9E1EC" stroke-width="1"/>
  <text x="670" y="296" font-family="Consolas, monospace" font-size="15" font-weight="400" fill="#6B7A90" text-anchor="start">GENERATE</text>
