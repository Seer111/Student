  <rect x="112" y="396" width="1056" height="260" rx="10" fill="#0F1B2D"/>
  <text x="136" y="428" font-family="Consolas, monospace" font-size="12" font-weight="400" fill="#7FA7D9" text-anchor="start">controllers/baiduAiController.js</text>
  <text x="136" y="452" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#D8E2F0" text-anchor="start">const chain = RunnableSequence.from([</text>
  <text x="136" y="476" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#8FB8E8" text-anchor="start">  retriever,</text>
  <text x="154" y="500" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#D8E2F0" text-anchor="start">promptTemplate,</text>
  <text x="154" y="524" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#D8E2F0" text-anchor="start">chatModel,</text>
  <text x="154" y="548" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#D8E2F0" text-anchor="start">new StringOutputParser(),</text>
  <text x="136" y="572" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#D8E2F0" text-anchor="start">]);</text>
  <text x="136" y="596" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#7FA7D9" text-anchor="start">// 等价写法：retriever.pipe(prompt).pipe(model).pipe(parser)</text>
  <text x="136" y="620" font-family="Consolas, monospace" font-size="14" font-weight="400" fill="#D8E2F0" text-anchor="start">const answer = await chain.invoke({ question, context });</text>
