<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F5F7FA"/>
  <line x1="80" y1="64" x2="80" y2="664" stroke="#16233A" stroke-width="4"/>
  <text x="1168" y="96" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#6B7A90">05 / 14</text>
  <text x="112" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#6B7A90">PART 2 · 后端出题官</text>
  <text x="112" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#16233A">出题 Prompt 的三段结构</text>
  <line x1="112" y1="176" x2="1168" y2="176" stroke="#D9E1EC" stroke-width="1"/>
  <text x="112" y="216" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#1F2933">提示词不是许愿，是把「谁来做、拿什么做、交什么格式」写死。</text>

  <rect x="112" y="252" width="440" height="96" rx="10" fill="#FFFFFF" stroke="#D9E1EC"/>
  <text x="136" y="288" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#16233A">① 角色</text>
  <text x="136" y="320" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#4A5568">资深计算机老师，负责出一道理科测验题。</text>

  <rect x="112" y="364" width="440" height="96" rx="10" fill="#FFFFFF" stroke="#D9E1EC"/>
  <text x="136" y="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#16233A">② 输入</text>
  <text x="136" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#4A5568">知识点正文 + 难度（基础 / 中等 / 困难）。</text>

  <rect x="112" y="476" width="440" height="96" rx="10" fill="#FFFFFF" stroke="#D9E1EC"/>
  <text x="136" y="512" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#16233A">③ 输出</text>
  <text x="136" y="544" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#4A5568">只返回 JSON：不要 Markdown 围栏，不要解释。</text>

  <rect x="600" y="212" width="568" height="400" rx="10" fill="#0F1B2D"/>
  <text x="624" y="248" font-family="Consolas, monospace" font-size="14" fill="#7FA7D9">prompt.js  ·  出题骨架</text>
  <text x="624" y="286" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">你是一位资深计算机老师。</text>
  <text x="624" y="314" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">【知识点】</text>
  <text x="648" y="342" font-family="Consolas, monospace" font-size="15" fill="#8FB8E8">${knowledgePointContent}</text>
  <text x="624" y="370" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">【难度】${difficulty}</text>
  <text x="624" y="398" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">只输出一个 JSON 对象：</text>
  <text x="624" y="426" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">{</text>
  <text x="648" y="450" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">"type": "single",</text>
  <text x="648" y="474" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">"difficulty": "${difficulty}",</text>
  <text x="648" y="498" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">"question": "题干",</text>
  <text x="648" y="522" font-family="Consolas, monospace" font-size="15" fill="#8FB8E8">"options": { "A": "…", "B": "…", "C": "…", "D": "…" },</text>
  <text x="648" y="546" font-family="Consolas, monospace" font-size="15" fill="#8FB8E8">"answer": "A",</text>
  <text x="648" y="570" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">"explanation": "解析"</text>
  <text x="624" y="594" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">}</text>

  <line x1="112" y1="592" x2="552" y2="592" stroke="#F2994A" stroke-width="1"/>
  <text x="112" y="620" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#B06A1F">约束写成陈述句，比「请不要……」更稳。</text>
  <text x="112" y="648" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6B7A90">options 的键必须与 answer 的取值一致，前端才能直接比较。</text>
</svg>
