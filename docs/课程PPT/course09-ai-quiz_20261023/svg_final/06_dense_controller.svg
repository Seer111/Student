<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F5F7FA"/>
  <line x1="80" y1="64" x2="80" y2="664" stroke="#16233A" stroke-width="4"/>
  <text x="1168" y="96" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#6B7A90">06 / 14</text>
  <text x="112" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#6B7A90">PART 2 · 后端出题官</text>
  <text x="112" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#16233A">控制器只做三件事</text>
  <line x1="112" y1="176" x2="1168" y2="176" stroke="#D9E1EC" stroke-width="1"/>
  <text x="112" y="216" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#1F2933">取参数、调模型、解析 JSON；业务文案都放在 Prompt 里。</text>

  <circle cx="128" cy="292" r="16" fill="#16233A"/>
  <text x="128" y="298" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF">1</text>
  <text x="160" y="288" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#16233A">取值与校验</text>
  <text x="160" y="318" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#4A5568">从 req.body 取正文与难度，缺正文直接 400。</text>

  <circle cx="128" cy="396" r="16" fill="#16233A"/>
  <text x="128" y="402" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF">2</text>
  <text x="160" y="392" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#16233A">调模型</text>
  <text x="160" y="422" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#4A5568">temperature 压低，max_tokens 够装一整道题。</text>

  <circle cx="128" cy="500" r="16" fill="#16233A"/>
  <text x="128" y="506" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#FFFFFF">3</text>
  <text x="160" y="496" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#16233A">解析并返回</text>
  <text x="160" y="526" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#4A5568">JSON.parse 之后原样返回，字段交给前端渲染。</text>

  <rect x="600" y="212" width="568" height="380" rx="10" fill="#0F1B2D"/>
  <text x="624" y="248" font-family="Consolas, monospace" font-size="14" fill="#7FA7D9">controllers/aiController.js  ·  出题接口</text>
  <text x="624" y="288" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">const { knowledgePointContent, difficulty } = req.body;</text>
  <text x="624" y="316" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">if (!knowledgePointContent) {</text>
  <text x="648" y="344" font-family="Consolas, monospace" font-size="15" fill="#8FB8E8">return res.status(400).json({ msg: "缺少知识点正文" });</text>
  <text x="624" y="372" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">}</text>
  <text x="624" y="400" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0"> </text>
  <text x="624" y="428" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">const prompt = buildPrompt(knowledgePointContent, difficulty);</text>
  <text x="624" y="456" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">const raw = await callLLM(prompt);</text>
  <text x="624" y="484" font-family="Consolas, monospace" font-size="15" fill="#8FB8E8">const question = JSON.parse(raw);</text>
  <text x="624" y="512" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0"> </text>
  <text x="624" y="540" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">res.json(question);</text>

  <rect x="600" y="612" width="568" height="40" rx="6" fill="#FFFFFF" stroke="#D9E1EC"/>
  <text x="624" y="638" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#4A5568">POST /api/ai/generate-question</text>
</svg>
