<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F5F7FA"/>
  <line x1="80" y1="64" x2="80" y2="664" stroke="#16233A" stroke-width="4"/>
  <text x="1168" y="96" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#6B7A90">09 / 14</text>
  <text x="112" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#6B7A90">PART 3 · 前端考场</text>
  <text x="112" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#16233A">串行，是这个页面的骨架</text>
  <line x1="112" y1="176" x2="1168" y2="176" stroke="#D9E1EC" stroke-width="1"/>
  <text x="112" y="216" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#1F2933">一次只做一件事；任何一步失败，都不进入下一步。</text>

  <line x1="128" y1="296" x2="128" y2="560" stroke="#D9E1EC" stroke-width="2"/>
  <circle cx="128" cy="296" r="9" fill="#16233A"/>
  <text x="156" y="292" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#16233A">进页面</text>
  <text x="156" y="318" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#6B7A90">GET /knowledge-points/:id</text>

  <circle cx="128" cy="362" r="9" fill="#16233A"/>
  <text x="156" y="358" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#16233A">选难度并出题</text>
  <text x="156" y="384" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#6B7A90">POST /ai/generate-question（显示「正在出题中…」）</text>

  <circle cx="128" cy="428" r="9" fill="#16233A"/>
  <text x="156" y="424" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#16233A">作答</text>
  <text x="156" y="450" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#6B7A90">radio 列表；提交前校验已选项</text>

  <circle cx="128" cy="494" r="9" fill="#16233A"/>
  <text x="156" y="490" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#16233A">出结果</text>
  <text x="156" y="516" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#6B7A90">显示对错、正确答案、解析、「再来一题」</text>

  <circle cx="128" cy="560" r="9" fill="#2F80ED"/>
  <text x="156" y="556" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#2F80ED">错题回流</text>
  <text x="156" y="582" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#6B7A90">PUT /knowledge-points/:id → reviewList = true</text>

  <rect x="700" y="248" width="468" height="380" rx="10" fill="#0F1B2D"/>
  <text x="724" y="284" font-family="Consolas, monospace" font-size="14" fill="#7FA7D9">pages/QuizPage.jsx  ·  串行调用</text>
  <text x="724" y="322" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">// 1. 拉知识点正文</text>
  <text x="724" y="348" font-family="Consolas, monospace" font-size="15" fill="#8FB8E8">const res = await api.get(`/knowledge-points/${id}`);</text>
  <text x="724" y="374" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">setKnowledgePoint(res.data);</text>
  <text x="724" y="410" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">// 2. 出题：先置 isLoading</text>
  <text x="724" y="436" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">setIsLoading(true);</text>
  <text x="724" y="462" font-family="Consolas, monospace" font-size="15" fill="#8FB8E8">const q = await api.post("/ai/generate-question", {</text>
  <text x="744" y="488" font-family="Consolas, monospace" font-size="15" fill="#8FB8E8">knowledgePointContent: res.data.content, difficulty,</text>
  <text x="724" y="514" font-family="Consolas, monospace" font-size="15" fill="#8FB8E8">});</text>
  <text x="724" y="540" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">setQuestion(q.data); setIsLoading(false);</text>
  <text x="724" y="576" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">// 3. 作答后比较 selectedOption 与 answer</text>
</svg>
