<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F5F7FA"/>
  <line x1="80" y1="64" x2="80" y2="664" stroke="#16233A" stroke-width="4"/>
  <text x="1168" y="96" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#6B7A90">13 / 14</text>
  <text x="112" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#6B7A90">PART 4 · AI 阅卷与交付</text>
  <text x="112" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#16233A">挑战任务：拆成四个可勾选的点</text>
  <line x1="112" y1="176" x2="1168" y2="176" stroke="#D9E1EC" stroke-width="1"/>
  <text x="112" y="216" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#1F2933">支持简答题 = 出题加类型 + 新增评分接口 + 前端按类型分流。</text>

  <text x="112" y="266" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#16233A">后端</text>
  <line x1="112" y1="280" x2="640" y2="280" stroke="#D9E1EC" stroke-width="1"/>

  <rect x="112" y="300" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#16233A" stroke-width="1.5"/>
  <text x="148" y="315" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2933">generateQuestion 增加 type 参数</text>
  <text x="148" y="342" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6B7A90">single / short，切换两套 Prompt 模板</text>

  <rect x="112" y="374" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#16233A" stroke-width="1.5"/>
  <text x="148" y="389" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2933">新增 gradeAnswer 接口</text>
  <text x="148" y="416" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6B7A90">入参：question、answerKeyPoints、studentAnswer</text>

  <text x="664" y="266" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#16233A">前端</text>
  <line x1="664" y1="280" x2="1168" y2="280" stroke="#D9E1EC" stroke-width="1"/>

  <rect x="664" y="300" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#16233A" stroke-width="1.5"/>
  <text x="700" y="315" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2933">按 question.type 渲染输入</text>
  <text x="700" y="342" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6B7A90">single → radio；short → textarea</text>

  <rect x="664" y="374" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#16233A" stroke-width="1.5"/>
  <text x="700" y="389" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2933">提交时按类型分流</text>
  <text x="700" y="416" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6B7A90">简答题走 /ai/grade-answer，不再前端比较</text>

  <line x1="112" y1="470" x2="1168" y2="470" stroke="#D9E1EC" stroke-width="1"/>
  <text x="112" y="506" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2933">顺序建议：先做后端 ①②，用 Postman 各跑一次；再改前端——否则前端调不通时，你分不清是哪一层的问题。</text>
  <rect x="112" y="540" width="1056" height="60" rx="8" fill="#FFFFFF" stroke="#F2994A"/>
  <text x="136" y="576" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#B06A1F">验收：同一知识点，单选题与简答题各跑一遍，错题都进入复习列表。</text>
</svg>
