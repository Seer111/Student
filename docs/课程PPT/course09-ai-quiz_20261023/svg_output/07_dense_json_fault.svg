<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F5F7FA"/>
  <line x1="80" y1="64" x2="80" y2="664" stroke="#16233A" stroke-width="4"/>
  <text x="1168" y="96" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#6B7A90">07 / 14</text>
  <text x="112" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#6B7A90">PART 2 · 后端出题官</text>
  <text x="112" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#16233A">模型不听话时，接口要体面地失败</text>
  <line x1="112" y1="176" x2="1168" y2="176" stroke="#D9E1EC" stroke-width="1"/>
  <text x="112" y="216" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#1F2933">解析失败不是意外，是常态；接口必须给出可读的中文错误。</text>

  <rect x="112" y="252" width="600" height="300" rx="10" fill="#0F1B2D"/>
  <text x="136" y="288" font-family="Consolas, monospace" font-size="14" fill="#7FA7D9">防御性解析  ·  六行骨架</text>
  <text x="136" y="326" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">try {</text>
  <text x="160" y="352" font-family="Consolas, monospace" font-size="15" fill="#8FB8E8">const question = JSON.parse(raw);</text>
  <text x="160" y="378" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">res.json(question);</text>
  <text x="136" y="404" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">} catch (err) {</text>
  <text x="160" y="430" font-family="Consolas, monospace" font-size="15" fill="#F2A6A0">console.error("[出题] 不是 JSON：", raw.slice(0, 200));</text>
  <text x="160" y="456" font-family="Consolas, monospace" font-size="15" fill="#8FB8E8">res.status(500).json({ msg: "AI 返回格式错误，请稍后重试" });</text>
  <text x="136" y="482" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">}</text>
  <text x="136" y="516" font-family="Consolas, monospace" font-size="14" fill="#7FA7D9">再包一层 catch：网络超时与鉴权失败</text>

  <text x="760" y="280" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#16233A">Postman 验证清单</text>
  <line x1="760" y1="296" x2="1168" y2="296" stroke="#D9E1EC" stroke-width="1"/>
  <text x="760" y="336" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933">① 正常出题：返回 6 个字段，options 四选一</text>
  <text x="760" y="378" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933">② 空正文：400 与中文提示</text>
  <text x="760" y="420" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933">③ 超长正文：不截断、不超时</text>
  <text x="760" y="462" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#1F2933">④ 连续三次同难度：题目不重复</text>
  <rect x="760" y="500" width="408" height="52" rx="8" fill="#FFFFFF" stroke="#F2994A"/>
  <text x="780" y="532" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#B06A1F">失败路径必须可复现，否则上课现场就是事故。</text>
  <text x="112" y="648" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6B7A90">日志里保留原始返回的前 200 字符：这是下一个人定位问题的唯一线索。</text>
</svg>
