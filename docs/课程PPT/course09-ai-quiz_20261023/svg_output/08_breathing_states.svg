<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F5F7FA"/>
  <line x1="80" y1="64" x2="80" y2="664" stroke="#16233A" stroke-width="4"/>
  <text x="1168" y="96" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#6B7A90">08 / 14</text>
  <text x="112" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#6B7A90">PART 3 · 前端考场</text>
  <text x="112" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#16233A">五个 state 决定答题页长什么样</text>
  <line x1="112" y1="176" x2="1168" y2="176" stroke="#D9E1EC" stroke-width="1"/>
  <text x="112" y="216" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#1F2933">页面不是「画出来的」，是被状态驱动的。</text>

  <rect x="112" y="272" width="210" height="92" rx="10" fill="#FFFFFF" stroke="#16233A" stroke-width="1.5"/>
  <text x="132" y="308" font-family="Consolas, monospace" font-size="17" fill="#2F80ED">knowledgePoint</text>
  <text x="132" y="336" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6B7A90">先有正文，才能出题</text>

  <rect x="344" y="272" width="210" height="92" rx="10" fill="#FFFFFF" stroke="#16233A" stroke-width="1.5"/>
  <text x="364" y="308" font-family="Consolas, monospace" font-size="17" fill="#2F80ED">isLoading</text>
  <text x="364" y="336" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6B7A90">出题中，禁用提交</text>

  <rect x="576" y="272" width="210" height="92" rx="10" fill="#FFFFFF" stroke="#16233A" stroke-width="1.5"/>
  <text x="596" y="308" font-family="Consolas, monospace" font-size="17" fill="#2F80ED">question</text>
  <text x="596" y="336" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6B7A90">题目、选项、答案</text>

  <rect x="808" y="272" width="210" height="92" rx="10" fill="#FFFFFF" stroke="#16233A" stroke-width="1.5"/>
  <text x="828" y="308" font-family="Consolas, monospace" font-size="17" fill="#2F80ED">selectedOption</text>
  <text x="828" y="336" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6B7A90">用户的 A / B / C / D</text>

  <rect x="1040" y="272" width="128" height="92" rx="10" fill="#FFFFFF" stroke="#16233A" stroke-width="1.5"/>
  <text x="1060" y="308" font-family="Consolas, monospace" font-size="17" fill="#2F80ED">result</text>
  <text x="1060" y="336" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6B7A90">对错与解析</text>

  <line x1="112" y1="412" x2="1168" y2="412" stroke="#D9E1EC" stroke-width="1"/>
  <text x="112" y="452" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#4A5568">互斥关系：isLoading 与 question / result 不同时成立；selectedOption 依附 question。</text>
  <text x="112" y="486" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" fill="#4A5568">这五个变量一确定，页面该显示哪一段就是唯一解——不需要再写「显示逻辑」。</text>
  <rect x="112" y="530" width="1056" height="70" rx="8" fill="#FFFFFF" stroke="#D9E1EC"/>
  <text x="136" y="572" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#1F2933">习惯：先把 state 写全，再写 JSX；反过来写，一定会在「加载中的那一秒」出错。</text>
</svg>
