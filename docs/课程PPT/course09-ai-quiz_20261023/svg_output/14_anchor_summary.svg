<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F5F7FA"/>
  <line x1="80" y1="64" x2="80" y2="664" stroke="#16233A" stroke-width="4"/>
  <text x="1160" y="330" text-anchor="end" font-family="Microsoft YaHei, Arial, sans-serif" font-size="230" font-weight="700" fill="#16233A" opacity="0.05">09</text>
  <text x="1168" y="96" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#6B7A90">14 / 14</text>
  <text x="112" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#6B7A90">PART 4 · AI 阅卷与交付</text>
  <text x="112" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#16233A">今天带走三句话</text>
  <line x1="112" y1="176" x2="1168" y2="176" stroke="#D9E1EC" stroke-width="1"/>

  <text x="112" y="230" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#1F2933">一、Prompt 要写死角色、输入、输出格式。</text>
  <text x="112" y="272" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#1F2933">二、答题页是状态驱动的串行流程。</text>
  <text x="112" y="314" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#1F2933">三、错题回流复习列表，闭环才闭合。</text>

  <rect x="112" y="364" width="512" height="150" rx="10" fill="#FFFFFF" stroke="#D9E1EC"/>
  <text x="136" y="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#16233A">必做</text>
  <text x="136" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#4A5568">单选题「难度 → 出题 → 答题</text>
  <text x="136" y="458" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#4A5568">→ 评分 → 复习」全流程跑通。</text>
  <text x="136" y="492" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6B7A90">交付：截图 + 一条错题的复习状态。</text>

  <rect x="656" y="364" width="512" height="150" rx="10" fill="#FFFFFF" stroke="#F2994A"/>
  <text x="680" y="400" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#B06A1F">挑战</text>
  <text x="680" y="432" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#4A5568">完成简答题支持：出题加 type、</text>
  <text x="680" y="458" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#4A5568">新增 gradeAnswer、前端分流。</text>
  <text x="680" y="492" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6B7A90">提示：先让 Postman 跑通，再动前端。</text>

  <line x1="112" y1="556" x2="1168" y2="556" stroke="#D9E1EC" stroke-width="1"/>
  <text x="112" y="596" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" fill="#1F2933">下节课：RAG 检索增强生成——让 AI 与你的知识库对话。</text>
  <text x="112" y="632" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#6B7A90">学-练-评闭环，今天闭合。</text>
