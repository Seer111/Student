<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F5F7FA"/>
  <line x1="80" y1="64" x2="80" y2="664" stroke="#16233A" stroke-width="4"/>
  <text x="1168" y="96" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#6B7A90">06 / 12</text>
  <text x="112" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#6B7A90">PART 1 · 理论突破</text>
  <text x="112" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#16233A">意思越近，坐标越近</text>
  <line x1="112" y1="176" x2="1168" y2="176" stroke="#D9E1EC" stroke-width="1"/>
  <text x="112" y="216" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#1F2933">嵌入把语义压成坐标，检索就是找离问题最近的坐标。</text>

  <text x="112" y="286" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#16233A">向量是什么</text>
  <text x="112" y="318" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#4A5568">一长串浮点数，例如 384 个数字，就是这段文本的坐标。</text>

  <text x="112" y="380" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#16233A">怎么比较</text>
  <text x="112" y="412" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#4A5568">余弦相似度：越接近 1 越像，接近 0 就基本无关。</text>

  <text x="112" y="474" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#16233A">用在哪</text>
  <text x="112" y="506" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#4A5568">问题先向量化，再去库里找最近的 K 个块。</text>

  <line x1="112" y1="544" x2="552" y2="544" stroke="#F2994A" stroke-width="1"/>
  <text x="112" y="576" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#B06A1F">换模型 = 维度变了 = 整库重算，不能只补新块。</text>

  <rect x="620" y="252" width="548" height="320" rx="10" fill="#FFFFFF" stroke="#D9E1EC"/>
  <text x="644" y="286" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#6B7A90">语义空间示意</text>
  <line x1="660" y1="470" x2="1128" y2="470" stroke="#D9E1EC"/>
  <line x1="660" y1="470" x2="660" y2="316" stroke="#D9E1EC"/>
  <circle cx="760" cy="420" r="9" fill="#2F80ED"/>
  <text x="760" y="452" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#4A5568">React 生命周期</text>
  <circle cx="820" cy="400" r="9" fill="#2F80ED"/>
  <text x="820" y="386" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#4A5568">类组件</text>
  <circle cx="1060" cy="352" r="9" fill="#F2994A"/>
  <text x="1060" y="338" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#4A5568">今日天气</text>
  <line x1="760" y1="420" x2="820" y2="400" stroke="#2F80ED" stroke-width="1.5"/>
  <line x1="820" y1="400" x2="1060" y2="352" stroke="#D9E1EC" stroke-width="1.5"/>
  <text x="768" y="486" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#2F80ED">距离近 = 语义近</text>
  <text x="768" y="512" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" fill="#6B7A90">距离远 = 不相干</text>
</svg>
