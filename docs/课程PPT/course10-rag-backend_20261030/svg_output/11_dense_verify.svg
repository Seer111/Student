<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F5F7FA"/>
  <line x1="80" y1="64" x2="80" y2="664" stroke="#16233A" stroke-width="4"/>
  <text x="1168" y="96" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#6B7A90">11 / 12</text>
  <text x="112" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#6B7A90">PART 3 · 验证与收尾</text>
  <text x="112" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#16233A">三处证据：日志、文件、第二次追加</text>
  <line x1="112" y1="176" x2="1168" y2="176" stroke="#D9E1EC" stroke-width="1"/>
  <text x="112" y="216" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#1F2933">三步都看到预期现象，才算真的接好了。</text>

  <text x="112" y="272" font-family="Consolas, monospace" font-size="16" fill="#2F80ED">01</text>
  <text x="152" y="272" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#16233A">先删掉旧的 vector_store/</text>
  <text x="112" y="302" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#4A5568">避免把上一次的残留当成本次成果。</text>

  <text x="112" y="356" font-family="Consolas, monospace" font-size="16" fill="#2F80ED">02</text>
  <text x="152" y="356" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#16233A">POST 第一条知识点</text>
  <text x="112" y="386" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#4A5568">日志应依次出现：创建新的向量库 → 分割成 N 个块 → 已保存。</text>

  <text x="112" y="440" font-family="Consolas, monospace" font-size="16" fill="#2F80ED">03</text>
  <text x="152" y="440" font-family="Microsoft YaHei, Arial, sans-serif" font-size="19" font-weight="700" fill="#16233A">POST 第二条 + PUT 改内容</text>
  <text x="112" y="470" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#4A5568">第二次应显示「向已存在的向量库中添加」；改内容要再次触发重建。</text>

  <rect x="700" y="250" width="468" height="290" rx="10" fill="#FFFFFF" stroke="#D9E1EC"/>
  <text x="724" y="284" font-family="Consolas, monospace" font-size="14" fill="#6B7A90">feynman-platform-backend/vector_store/</text>
  <text x="724" y="316" font-family="Consolas, monospace" font-size="15" fill="#16233A">├─ args.json</text>
  <text x="724" y="344" font-family="Consolas, monospace" font-size="15" fill="#16233A">├─ docstore.json</text>
  <text x="724" y="372" font-family="Consolas, monospace" font-size="15" fill="#2F80ED">├─ hnswlib.index</text>
  <text x="724" y="400" font-family="Consolas, monospace" font-size="15" fill="#16233A">└─ …</text>
  <line x1="724" y1="424" x2="1144" y2="424" stroke="#D9E1EC"/>
  <text x="724" y="456" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#4A5568">这一目录就是「本地向量数据库」：</text>
  <text x="724" y="482" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#4A5568">文本、向量、索引都在里面，可以整个复制带走。</text>

  <text x="112" y="556" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#B06A1F">常见坑：Embedding API Key 没配 → 日志里有报错、但接口仍 200（因为异步 + 容错）。</text>
  <text x="112" y="592" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#6B7A90">所以验证只看接口返回不够，必须看后端日志与文件系统。</text>
</svg>
