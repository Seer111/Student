<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F5F7FA"/>
  <line x1="80" y1="64" x2="80" y2="664" stroke="#16233A" stroke-width="4"/>
  <text x="1168" y="96" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#6B7A90">10 / 12</text>
  <text x="112" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#6B7A90">PART 2 · 后端基础设施</text>
  <text x="112" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#16233A">创建就入库，改内容才重建</text>
  <line x1="112" y1="176" x2="1168" y2="176" stroke="#D9E1EC" stroke-width="1"/>
  <text x="112" y="216" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#1F2933">调用是异步的：不等向量化完成，接口先返回。</text>

  <text x="112" y="268" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#16233A">POST / · 新建就入库</text>
  <rect x="112" y="284" width="512" height="150" rx="10" fill="#0F1B2D"/>
  <text x="136" y="316" font-family="Consolas, monospace" font-size="14" fill="#8FB8E8">const kp = await newKp.save();</text>
  <text x="136" y="344" font-family="Consolas, monospace" font-size="14" fill="#D8E2F0">addKnowledgePointToStore(kp);</text>
  <text x="136" y="372" font-family="Consolas, monospace" font-size="14" fill="#8FB8E8">res.json(kp);</text>
  <text x="136" y="408" font-family="Consolas, monospace" font-size="13" fill="#7FA7D9">// 不 await：向量化很慢，别让用户等</text>

  <text x="656" y="268" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#16233A">PUT /:id · 内容变了才重建</text>
  <rect x="656" y="284" width="512" height="150" rx="10" fill="#0F1B2D"/>
  <text x="680" y="316" font-family="Consolas, monospace" font-size="14" fill="#8FB8E8">const updated = await findByIdAndUpdate(...);</text>
  <text x="680" y="344" font-family="Consolas, monospace" font-size="14" fill="#D8E2F0">if (updated.content !== old.content) {</text>
  <text x="704" y="370" font-family="Consolas, monospace" font-size="14" fill="#D8E2F0">addKnowledgePointToStore(updated);</text>
  <text x="680" y="396" font-family="Consolas, monospace" font-size="14" fill="#D8E2F0">}</text>

  <rect x="112" y="472" width="512" height="120" rx="10" fill="#FFFFFF" stroke="#D9E1EC"/>
  <text x="136" y="504" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#16233A">为什么要异步</text>
  <text x="136" y="534" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#4A5568">一次向量化几百毫秒到几秒；</text>
  <text x="136" y="560" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#4A5568">同步等会让保存按钮转圈到用户以为卡死。</text>

  <rect x="656" y="472" width="512" height="120" rx="10" fill="#FFFFFF" stroke="#D9E1EC"/>
  <text x="680" y="504" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#16233A">本课的简化</text>
  <text x="680" y="534" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#4A5568">更新时旧块不删、允许冗余；</text>
  <text x="680" y="560" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#4A5568">生产环境用支持删除的向量库。</text>

  <text x="112" y="628" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#B06A1F">注意：异步调用失败只在后端日志里出现，所以下一节才要「看日志验证」。</text>
</svg>
