<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F5F7FA"/>
  <line x1="80" y1="64" x2="80" y2="664" stroke="#16233A" stroke-width="4"/>
  <text x="1168" y="96" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#6B7A90">08 / 12</text>
  <text x="112" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#6B7A90">PART 2 · 后端基础设施</text>
  <text x="112" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#16233A">先装包，再建 vectorStoreService.js</text>
  <line x1="112" y1="176" x2="1168" y2="176" stroke="#D9E1EC" stroke-width="1"/>
  <text x="112" y="216" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#1F2933">所有向量相关逻辑集中在一个服务文件，路由只负责调用。</text>

  <rect x="112" y="248" width="1056" height="76" rx="10" fill="#0F1B2D"/>
  <text x="136" y="280" font-family="Consolas, monospace" font-size="13" fill="#7FA7D9">在 feynman-platform-backend 下执行</text>
  <text x="136" y="308" font-family="Consolas, monospace" font-size="15" fill="#D8E2F0">npm install langchain @langchain/community @langchain/baidu-qianfan hnswlib-node</text>

  <text x="112" y="376" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#16233A">四个包，各管一件事</text>
  <text x="112" y="408" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#4A5568">langchain 核心 · community 里的加载器与分割器 ·</text>
  <text x="112" y="436" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#4A5568">baidu-qianfan 的 Embedding 封装 · hnswlib-node 的本地索引绑定</text>

  <rect x="640" y="360" width="528" height="220" rx="10" fill="#FFFFFF" stroke="#D9E1EC"/>
  <text x="664" y="392" font-family="Consolas, monospace" font-size="14" fill="#6B7A90">文件位置</text>
  <text x="664" y="424" font-family="Consolas, monospace" font-size="15" fill="#16233A">feynman-platform-backend/</text>
  <text x="688" y="452" font-family="Consolas, monospace" font-size="15" fill="#2F80ED">services/vectorStoreService.js</text>
  <text x="688" y="480" font-family="Consolas, monospace" font-size="15" fill="#4A5568">vector_store/ ← 运行后自动生成</text>
  <text x="664" y="514" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#6B7A90">服务文件里两个常量决定数据落哪</text>
  <text x="664" y="546" font-family="Consolas, monospace" font-size="14" fill="#2F80ED">VECTOR_STORE_PATH = ../vector_store</text>

  <text x="112" y="600" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#6B7A90">安装时如果 hnswlib-node 编译失败，先装 Python 与 C++ 构建工具，再重装。</text>
</svg>
