<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F5F7FA"/>
  <line x1="80" y1="64" x2="80" y2="664" stroke="#16233A" stroke-width="4"/>
  <text x="1168" y="96" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#6B7A90">03 / 12</text>
  <text x="112" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#6B7A90">PART 1 · 理论突破</text>
  <text x="112" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#16233A">问题不在模型，在「一次只能看几页」</text>
  <line x1="112" y1="176" x2="1168" y2="176" stroke="#D9E1EC" stroke-width="1"/>
  <text x="112" y="216" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#1F2933">两个限制叠在一起，就逼出了 RAG。</text>

  <rect x="112" y="252" width="512" height="150" rx="10" fill="#FFFFFF" stroke="#D9E1EC"/>
  <text x="136" y="288" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#16233A">限制一 · 单点上下文</text>
  <text x="136" y="322" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#4A5568">每个 AI 功能只看得到「一个」知识点。</text>
  <text x="136" y="350" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#4A5568">问「类组件和函数组件生命周期有什么不同」，</text>
  <text x="136" y="378" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#4A5568">两个知识点分开存，模型答不了。</text>

  <rect x="656" y="252" width="512" height="150" rx="10" fill="#FFFFFF" stroke="#D9E1EC"/>
  <text x="680" y="288" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#16233A">限制二 · 上下文长度</text>
  <text x="680" y="322" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#4A5568">20 页 PDF 全文塞不进 Prompt —— 有 token 上限。</text>
  <text x="680" y="350" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#4A5568">塞不下就只能截断，截断就等于丢信息。</text>

  <rect x="112" y="432" width="1056" height="150" rx="10" fill="#0F1B2D"/>
  <text x="136" y="470" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="700" fill="#7FA7D9">RAG 的定义（一句话）</text>
  <text x="136" y="506" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#D8E2F0">不要把整座图书馆塞给 AI，而是先帮它找到最相关的几页书，</text>
  <text x="136" y="540" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" fill="#D8E2F0">再把「这几页 + 问题」一起交给模型去读。</text>
  <text x="136" y="570" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#7FA7D9">Retrieval-Augmented Generation · 检索增强生成</text>

  <text x="112" y="628" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#6B7A90">关键词：检索（找书）· 增强（把书页塞进上下文）· 生成（基于书页回答）</text>
</svg>
