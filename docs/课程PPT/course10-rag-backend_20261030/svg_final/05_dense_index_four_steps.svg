<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#F5F7FA"/>
  <line x1="80" y1="64" x2="80" y2="664" stroke="#16233A" stroke-width="4"/>
  <text x="1168" y="96" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#6B7A90">05 / 12</text>
  <text x="112" y="96" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#6B7A90">PART 1 · 理论突破</text>
  <text x="112" y="150" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="700" fill="#16233A">索引四步：加载、分割、嵌入、存储</text>
  <line x1="112" y1="176" x2="1168" y2="176" stroke="#D9E1EC" stroke-width="1"/>
  <text x="112" y="216" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#1F2933">索引就是把文档变成坐标——分割粒度决定检索质量。</text>

  <text x="112" y="282" font-family="Consolas, monospace" font-size="17" fill="#2F80ED">01</text>
  <text x="152" y="282" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#16233A">加载</text>
  <text x="216" y="282" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#4A5568">TXT / PDF / Markdown 读成纯文本，来源不限。</text>

  <text x="112" y="342" font-family="Consolas, monospace" font-size="17" fill="#2F80ED">02</text>
  <text x="152" y="342" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#16233A">分割</text>
  <text x="216" y="342" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#4A5568">按段落/句子切成块，块之间留重叠，避免把一句话切断。</text>

  <text x="112" y="402" font-family="Consolas, monospace" font-size="17" fill="#2F80ED">03</text>
  <text x="152" y="402" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#16233A">嵌入</text>
  <text x="216" y="402" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#4A5568">每个块过一次 Embedding 模型，输出一串浮点数（向量）。</text>

  <text x="112" y="462" font-family="Consolas, monospace" font-size="17" fill="#2F80ED">04</text>
  <text x="152" y="462" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700" fill="#16233A">存储</text>
  <text x="216" y="462" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#4A5568">块原文 + 向量 + 元数据（knowledgePointId）一起入库。</text>

  <rect x="760" y="262" width="408" height="248" rx="10" fill="#FFFFFF" stroke="#D9E1EC"/>
  <text x="784" y="298" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#16233A">分割参数（起点）</text>
  <text x="784" y="336" font-family="Consolas, monospace" font-size="16" fill="#2F80ED">chunkSize: 500</text>
  <text x="784" y="362" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#6B7A90">每块最多 500 字</text>
  <text x="784" y="400" font-family="Consolas, monospace" font-size="16" fill="#2F80ED">chunkOverlap: 50</text>
  <text x="784" y="426" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#6B7A90">相邻块重叠 50 字</text>
  <line x1="784" y1="448" x2="1144" y2="448" stroke="#D9E1EC"/>
  <text x="784" y="478" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" fill="#B06A1F">块太大：检索不准；块太小：语义被切碎。</text>

  <text x="112" y="580" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#6B7A90">四步串行，任何一步的输出都直接喂给下一步；这一步做错，后面检索再准也没用。</text>
  <text x="112" y="614" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#6B7A90">元数据别忘了带 knowledgePointId——检索回来要靠它知道「这段话属于哪个知识点」。</text>
</svg>
