# Nginx 配置（16课：容器化部署）
# 作用：1) 托管前端静态文件；2) SPA 路由回退到 index.html；3) 将 /api 请求反向代理到后端容器
# 2026-11-13 补齐三处部署硬伤：上传体积上限、service worker 缓存、gzip
server {
    listen 80;
    server_name _;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # 录音上传默认会超 1 MB（后端 multer 允许 10 MB），
    # 不抬这个上限的话，容器部署下稍长的录音会被 Nginx 直接 413，而 dev（Vite 代理）不复现
    client_max_body_size 12m;

    # 文本类资源压缩：主包约 3.6 MB，不压缩传太亏
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # API 反向代理：转发到后端服务（docker-compose 中的服务名 backend:3000）
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AI 接口偶发慢响应，给足读超时，避免 60s 处被 Nginx 掐断
        proxy_read_timeout 120s;
    }

    # SPA 前端路由：任何不存在的路径都回退到 index.html，交给 React Router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # service worker 必须每次回源校验：被缓存住的话，发了新版本用户仍跑旧 SW
    # 注意用 expires off 而不是 expires -1：后者会再写一条 Cache-Control，响应头里会出现两份
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # workbox 运行时文件名带构建 hash，不能写死具体名字；
    # 这段正则必须排在下面通用静态资源规则之前，否则会先被 7 天缓存命中
    location ~ ^/workbox-[^/]+\.js$ {
        expires off;
        add_header Cache-Control "no-cache" always;
    }

    # 静态资源缓存：文件名自带 hash，可以放心长缓存
    # （sw.js / workbox-*.js 已由上面的精确匹配与专用正则接管，不会命中这里）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2)$ {
        expires 7d;
    }
}
